# Drop-in for hervoice-stt.service: run faster-whisper on the GPU.
# Install as /etc/systemd/system/hervoice-stt.service.d/zz-gpu.conf, then
# `systemctl daemon-reload && systemctl restart hervoice-stt`.
# int8_float16 gave the same speed and transcripts as float16 on the test clips
# for about 1 GB less VRAM. The service falls back to CPU int8 by itself if the
# GPU cannot take the model. Remove this file + daemon-reload to return to CPU.
[Service]
Environment=LD_LIBRARY_PATH=/home/foscam/hervoice-gpu-libs/libs/nvidia/cudnn/lib:/usr/local/cuda/targets/x86_64-linux/lib
ExecStart=
ExecStart=/home/foscam/herVoice/venv/bin/python /home/foscam/herVoice/backend/services/stt_server.py --port 15556 --model large-v3-turbo --device cuda --compute int8_float16 --host 0.0.0.0
